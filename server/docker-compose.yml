services:
  postgres:
    image: postgres:16-alpine
    container_name: novazheh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: novazhe-backend:latest
    container_name: novazheh-backend
    restart: unless-stopped
    environment:
      USE_POSTGRES: "true"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      DATABASE_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_ISSUER: ${JWT_ISSUER:-novazheh-server}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-novazheh-users}
      CONTENT_BASE_URL: ${CONTENT_BASE_URL:?CONTENT_BASE_URL must be set in .env}
      CONTENT_DIR: /app/content
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-novazheh-postgres-data}




